name: App

on:
  push:
    paths-ignore:
      - "supabase/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "supabase/**"
      - "**.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
